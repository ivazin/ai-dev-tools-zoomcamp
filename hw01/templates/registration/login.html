{% extends "base.html" %}

{% block title %}Log in - Household Chore Manager{% endblock %}

{% block content %}
<div class="flex justify-center items-center" style="min-height: 60vh;">
  <div class="card" style="width: 100%; max-width: 420px;">
    <div class="card-header">
      <h2>Roommate Log In</h2>
    </div>
    <div class="card-body">
      {% if form.errors %}
        <div class="alert alert-danger" style="margin-bottom: var(--space-4);">
          Your username and password didn't match. Please try again.
        </div>
      {% endif %}

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}" />

        <div class="form-group">
          <label class="form-label" for="id_username">Username</label>
          <input type="text" name="username" autofocus required id="id_username" class="form-input" />
        </div>

        <div class="form-group">
          <label class="form-label" for="id_password">Password</label>
          <input type="password" name="password" required id="id_password" class="form-input" />
        </div>

        <div style="margin-top: var(--space-4);">
          <button type="submit" class="btn btn-primary" style="width: 100%;">Sign in</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
